# Production compose project for the always-on receipt-index service.
#
# The repo-root docker-compose.yml is the *dev* stack (db + GreenMail) and is
# untouched by this file. There is no GreenMail here.
#
# Run it from the clone root:
#     docker compose -f deploy/docker-compose.yml up -d
#
# Path conventions, because compose resolves relative paths against the
# directory holding this file (deploy/), not the working directory:
#   ./  -> deploy/            (config that is version-controlled)
#   ../ -> the clone root     (secrets and mutable server state, git-ignored)
#
# Server state that lives at the clone root: .env, .env.db, data/receipts,
# data/backups, rclone-config/. All three data directories must be owned by
# uid/gid 1000 (the image's appuser) — see docs/user/server-deployment.md.

name: receipt-index

services:
  db:
    image: postgres:18
    restart: unless-stopped
    # POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD and the three login
    # passwords db-init reads (RECEIPT_INDEX_PASSWORD, RECEIPT_INDEX_WRITE_PASSWORD,
    # RECEIPT_INDEX_READ_PASSWORD) come from ../.env.db, which holds the
    # owner and superuser credentials and which only this service and the
    # host-side `make migrate-up` read. The scheduler never sees it. See
    # deploy/example.env.db. env_file (container environment) is used rather
    # than ${VAR} interpolation because the env files live at the clone root,
    # and compose only auto-loads a .env sitting next to the compose file — so
    # interpolated values would silently resolve to empty. The file is
    # required: if it is missing, `config` and `up` fail before touching a
    # container.
    env_file: ../.env.db
    ports:
      # Loopback only. Enough for `make migrate-up`, psql, and pg_restore on
      # the server (and from the laptop over an SSH tunnel); not reachable
      # from the network.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      # PostgreSQL 18 requires the volume at /var/lib/postgresql — NOT the
      # /var/lib/postgresql/data subdirectory used by earlier majors.
      # Getting this wrong loses the cluster on the next container restart.
      - pgdata:/var/lib/postgresql
      # Runs once, on first boot of an empty volume.
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      # Always-on box: container logs share a disk with pgdata and the receipt
      # store, so they are capped rather than left to grow without bound.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  scheduler:
    build:
      # Build context is the clone root; `dockerfile` is resolved relative to
      # the context, so it is a bare filename here, not ../Dockerfile.
      context: ..
      dockerfile: Dockerfile
    image: receipt-index
    # supercronic replaces the image's ENTRYPOINT ["receipt-index"]. It runs
    # the Dropbox mirror and backup lines only; ingest runs in the `ingest`
    # service below. The CLI is still reachable for ad-hoc use via
    # `docker compose ... exec scheduler receipt-index <cmd>`. No
    # stop_grace_period: no cron line runs an ingest any more, so the default
    # is enough.
    entrypoint: ["supercronic", "/app/crontab"]
    restart: unless-stopped
    # PID 1 zombie reaping: Chromium forks aggressively during rendering
    # (an ad-hoc `exec scheduler receipt-index retry` still renders).
    init: true
    # Chromium crashes on the 64 MB default /dev/shm.
    shm_size: 1gb
    depends_on:
      db:
        condition: service_healthy
    # Secrets: IMAP_PASSWORD, ANTHROPIC_API_KEY, GDRIVE_TOKEN_JSON,
    # DATABASE_URL (the write login), RECEIPT_INDEX_READ_DATABASE_URL and
    # RECEIPT_INDEX_MCP_DATABASE_URL (the read login). Never baked into the
    # image. See deploy/example.env. No owner or superuser credential belongs
    # in ../.env: those live in ../.env.db, which this service doesn't read
    # (tests/unit/test_deploy_env_split.py checks it).
    env_file: ../.env
    environment:
      # Explicit rather than relying on CWD-relative config discovery, which
      # breaks under `docker compose exec -w`.
      RECEIPT_INDEX_CONFIG: /app/receipt-index.yaml
      # Pinned explicitly because env_file values override baked image ENV: a
      # stray PLAYWRIGHT_BROWSERS_PATH in ../.env (e.g. the dev .playwright
      # value) would otherwise silently break Chromium discovery and downgrade
      # every HTML receipt to the weasyprint fallback. Service-level
      # environment: beats env_file, making that leak mechanically impossible.
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    volumes:
      # Rendered receipt tree. Bind-mounted (not a named volume) so it can be
      # rsynced in at cutover and read by rclone from the host if needed.
      - ../data/receipts:/app/data/receipts
      # Nightly pg_dump output, mirrored to Dropbox by the sync cron line.
      - ../data/backups:/app/data/backups
      # Access log of the read-only MCP server (`receipt-index mcp`), one JSON
      # line per file fetch. Deliberately outside data/receipts and
      # data/backups: both are copied to Dropbox, and the log must neither
      # change the file store nor leave the host. Point
      # RECEIPT_INDEX_MCP_ACCESS_LOG at /app/data/mcp-logs/mcp-access.jsonl.
      - ../data/mcp-logs:/app/data/mcp-logs
      # Copied from deploy/example.receipt-index.yaml at provision time and
      # edited with your sources; the copy is gitignored.
      - ./receipt-index.yaml:/app/receipt-index.yaml:ro
      - ./crontab:/app/crontab:ro
      - ./backup.sh:/app/backup.sh:ro
      # rclone's config directory, mounted READ-WRITE and as a whole directory.
      # Dropbox access tokens are short-lived; on refresh rclone rewrites
      # rclone.conf by creating a temp file and renaming it over the original.
      # A :ro mount or a single-file bind mount breaks that rename and the
      # mirror dies silently a few hours after deploy. See rclone-setup.md.
      - ../rclone-config:/app/.rclone
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  # Always-on ingest: `receipt-index serve` watches every source (IMAP IDLE,
  # Drive polling), runs due retries and writes the health heartbeat. It holds
  # each source's lock, so a one-shot `receipt-index ingest` run anywhere else
  # exits 3 rather than race it. See docs/user/server-deployment.md, "Cutover
  # to serve", for the rollout and rollback.
  ingest:
    build:
      context: ..
      dockerfile: Dockerfile
    image: receipt-index
    entrypoint: ["receipt-index", "serve"]
    # Restarts serve when it exits, including a watchdog exit (code 4) after an
    # item outran item_timeout_seconds. Docker doesn't restart an unhealthy
    # container: the healthcheck is a signal, and the dead-man's ping (the
    # ping_url key) is the alert.
    restart: unless-stopped
    # On SIGTERM serve finishes the item in hand, which may run for up to
    # ingest.item_timeout_seconds (1200 s by default, and never less). This is
    # that plus a minute, so `stop` or `up -d` never SIGKILLs an item in its
    # time. Raise it with item_timeout_seconds. A host shutdown is bounded by
    # the Docker daemon's own stop timeout instead; an item it cuts short is
    # recovered after the restart (design section 6, the dead `started` rule).
    stop_grace_period: 21m
    # PID 1 zombie reaping: Chromium forks aggressively during rendering.
    init: true
    # Chromium crashes on the 64 MB default /dev/shm.
    shm_size: 1gb
    depends_on:
      db:
        condition: service_healthy
    # The same environment as the scheduler, and the same rule: no owner or
    # superuser credential (tests/unit/test_deploy_env_split.py checks both).
    env_file: ../.env
    environment:
      RECEIPT_INDEX_CONFIG: /app/receipt-index.yaml
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    volumes:
      - ../data/receipts:/app/data/receipts
      - ./receipt-index.yaml:/app/receipt-index.yaml:ro
    healthcheck:
      # Fails when serve's heartbeat is missing or stale, a source is stale,
      # paused too long or lost its lock, or the database can't be reached.
      # Terminal failures never fail it.
      test: ["CMD", "receipt-index", "status", "--check"]
      interval: 60s
      timeout: 30s
      retries: 3
      # serve writes its first heartbeat about 15 s after `up -d` (measured on
      # devtest). Two minutes leaves room for a host reboot, when the restart
      # policy starts this service alongside a database that is still coming up.
      start_period: 2m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

volumes:
  pgdata:
