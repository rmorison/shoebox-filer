# Server application config TEMPLATE. Copy to deploy/receipt-index.yaml
# (gitignored) and fill in your source definitions; the copy is mounted
# read-only at /app/receipt-index.yaml via RECEIPT_INDEX_CONFIG in
# deploy/docker-compose.yml.
#
# Mirrors the source definitions of the repo-root receipt-index.yaml. Two
# deliberate differences:
#
#   1. store.path is the absolute in-container bind-mount path. The dev config
#      uses ./data/receipts, which resolves against the CWD — fragile under
#      `docker compose exec -w`.
#   2. The gdrive source drops `credentials_json`. GdriveSourceConfig has no
#      such field (it is ignored on parse), but ${VAR} interpolation happens
#      *before* parsing and hard-fails on undefined names — so keeping the key
#      would force GDRIVE_CREDENTIALS_JSON into the server .env purely to
#      satisfy a value nothing reads. The OAuth client id/secret needed for
#      token refresh are already inside GDRIVE_TOKEN_JSON.
#
# Every ${VAR} below must be defined in the clone-root .env — see
# deploy/example.env. A missing one aborts startup with the full list.

sources:
  - name: personal-email
    type: imap
    host: mail.example.com
    port: 993
    username: user@example.com
    password: ${IMAP_PASSWORD}
    folder: INBOX.Receipts
    use_ssl: true

  - name: scanned-receipts
    type: gdrive
    folder_id: "replace-with-gdrive-folder-id"
    token_json: ${GDRIVE_TOKEN_JSON}

# Timing for `receipt-index serve` (the compose `ingest` service) and the
# one-shot `ingest`. Every key has a default; these are the defaults.
ingest:
  idle_reissue_seconds: 600
  imap_poll_seconds: 240        # IMAP safety poll; the only poll without IDLE
  drive_poll_seconds: 120
  drive_settle_seconds: 60
  # How long one item may run before serve's watchdog restarts it. At least
  # 1200. The ingest service's stop_grace_period in deploy/docker-compose.yml
  # is this plus a minute: raise both together.
  item_timeout_seconds: 1200
  transient_item_max_seconds: 21600
  retry_max_attempts: 3
  retry_backoff_seconds: [300, 1800, 7200, 43200]
  health:
    heartbeat_stale_seconds: 120
    # source_stale_seconds: 900   # optional; default is 3x each source's poll interval
    terminal_alert_seconds: 86400
    ping_interval_seconds: 300
    # The dead-man's ping. Leave this commented out until HEALTH_PING_URL is
    # set in the clone-root .env: the loader refuses an unset ${VAR}, so the
    # key without the variable stops every command, including the ingest
    # container's healthcheck and a rollback `ingest`.
    # ping_url: ${HEALTH_PING_URL}

database:
  url: ${DATABASE_URL}

store:
  backend: local
  path: /app/data/receipts

llm:
  model: claude-haiku-5-5
  api_key: ${ANTHROPIC_API_KEY}
  # Optional list prices per million tokens, for `reextract --dry-run` cost
  # estimates.
  # price_per_mtok_input: 0.10
  # price_per_mtok_output: 0.50

logging:
  level: INFO
